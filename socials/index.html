<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dm. — редизайн</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='30' font-weight='bold' fill='%23d946ef' text-anchor='middle'%3Edm.%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #202124;
    color: #e8eaed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  /* Иконка */
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a3a3a, #1a1a1a);
    border: 1px solid #3c4043;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    color: #9aa0a6;
    font-weight: 300;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .5; }
  }

  /* Заголовок */
  h1 {
    font-size: 26px;
    font-weight: 400;
    color: #f1f3f4;
    letter-spacing: 0.3px;
    margin-bottom: 12px;
  }

  /* Код ошибки */
  .code {
    display: inline-block;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 12px;
    color: #9aa0a6;
    padding: 5px 12px;
    background: #292a2d;
    border: 1px solid #3c4043;
    border-radius: 4px;
    margin-bottom: 22px;
    letter-spacing: 1px;
  }

  /* Подпись */
  .sub {
    font-size: 15px;
    line-height: 1.6;
    color: #9aa0a6;
    margin-bottom: 32px;
  }

  /* Кнопка */
  .btn {
    display: inline-block;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 6px;
    background: #8ab4f8;
    color: #202124;
    letter-spacing: 0.3px;
    transition: background .2s, transform .2s;
  }

  .btn:hover {
    background: #aecbfa;
    transform: translateY(-1px);
  }

  /* Нижняя подпись */
  .footer {
    margin-top: 48px;
    font-size: 11px;
    color: #5f6368;
    letter-spacing: 2px;
  }

  @media (max-width: 480px) {
    h1 { font-size: 20px; }
    .sub { font-size: 14px; }
    .icon { width: 60px; height: 60px; font-size: 30px; }
    .btn { padding: 10px 22px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="icon">!</div>

  <h1>РЕДИЗАЙН ИДЁТ!</h1>
  <div class="code">SITE UNDER REDESIGN</div>

  <div class="sub">
    Современная версия сайта временно недоступна.<br>
    Пока что пользуйтесь старой версией.
  </div>

  <a class="btn" href="https://damersimba318-sketch.github.io/dm.old/#home">
    → Открыть Old version
  </a>

  <div class="footer">dm. © 2026</div>

</div>

</body>
</html>
